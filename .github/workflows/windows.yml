name: windows-build-on-push

on:
  #private or public?
  push:
  # release:

jobs:
  build:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Install Git LFS
        run: git lfs install

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Install llvm19.1.7, vcredist140 and nsis via Chocolatey
        run: |
          choco install vcredist140 -y
          choco install llvm --version=19.1.7 -y
          choco install nsis -y

      - name: Copy Dlls
        run: |
          copy "C:\Windows\System32\vcruntime140.dll" "./src-tauri/assets/windows/dlls"
          copy "C:\Windows\System32\vcruntime140_1.dll" "./src-tauri/assets/windows/dlls"
          copy "C:\Windows\System32\msvcp140.dll" "./src-tauri/assets/windows/dlls"
          copy "C:\Windows\System32\msvcp140_1.dll" "./src-tauri/assets/windows/dlls"
          copy "C:\Windows\System32\concrt140.dll" "./src-tauri/assets/windows/dlls"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: List bundle directory
        run: |
          echo "=== Bundle directory content ==="
          dir "./src-tauri/target/release/bundle" -Recurse
          echo "=== NSIS directory content ==="
          dir "./src-tauri/target/release/bundle/nsis"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-installer
          path: |
            ./src-tauri/target/release/bundle/nsis/*.exe

      - name: List release directory
        run: |
          echo "=== Release directory content ==="
          dir "./src-tauri/target/release"
