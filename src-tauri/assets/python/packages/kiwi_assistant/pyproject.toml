[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-assistant"
version = "2.0.0"
description = "kiwi assistant lib"
authors = [{ name = "kiwi-assistant", email = "kiwi-assistant@biexi.com" }]
readme = "README.md"
requires-python = ">=3.13"

# websocket-client 是 kiwi 库连接后端时使用
# uv 用于创建标准python 项目时使用
dependencies = ["websocket-client","uv"] 

[tool.setuptools]
packages = ["kiwi_assistant"]
