[package]
name = "Kiwi"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiwi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
regex = "1.11.1"
anyhow = "1.0.98"
toml = "0.8.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-zip = { git = "https://github.com/qzd1989/simple-zip.git" }
fs_extra = "1.3.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"


# custom
display-info = "0.5.4"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
anyhow = "1.0.98"
image = { version = "0.25.6", features = ["jpeg", "png"] }
imageproc = { version = "0.25" }
base64 = "0.22.1"
fs_extra = "1.3.0"
regex = "1.11.1"
arc-swap = "1.7.1"
shell-words = "1.1.0"
libc = "0.2.172"
paddle-ocr-rs = "0.6.0"
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = { version = "0.7.15" }
tokio-tungstenite = "0.26.2"
futures-util = "0.3.31"
dirs = "6.0.0"
toml = "0.8.23"
crossbeam-channel = "0.5.15"                                                   #use channel
device_query = "4.0.1"                                                         #get mouse location
uuid = { version = "1.17.0", features = ["v4"] }                               #todo
rayon = "1.10.0"
capture = { git = "https://github.com/qzd1989/capture.git" }
enigo = { git = "https://github.com/qzd1989/enigo.git", features = ["serde"] }
rdev = { git = "https://github.com/qzd1989/rdev.git" }                         #recording mouse and keyboard
chrono = { version = "0.4.41", features = ["serde"] }                          #format time for logs
rust-i18n = "3"
encoding_rs = "0.8.35"
reqwest = { version = "0.12.22", features = ["json"] }
log="0.4.28"
local-ip-address = "0.6.5"                                                     #test websocket is_alive need LAN IP
md5="0.8.0"
tauri-plugin-websocket = "2"
# custom end

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# 截屏时使kiwi窗口透明
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_UI_WindowsAndMessaging",
] }
# end

# 在开发环境中加快运行速度，如图像运算，dev环境默认 opt-level = 0
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.imageproc]
opt-level = 3
debug = true
overflow-checks = false
# end
